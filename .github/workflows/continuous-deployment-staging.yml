name: CD

on:
  push:
    branches:
      - staging

permissions:
  contents: read
  packages: write

jobs:
  cd:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags (lower case repository owner)
        id: prep
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BRANCH_NAME=${BRANCH}" >> $GITHUB_OUTPUT
          echo "OWNER_LOWER=${OWNER}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v5.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.OWNER_LOWER }}/iwvg-devops-2026-${{ steps.prep.outputs.BRANCH_NAME }}:latest

      # 🌐 Render Deployment
      # 1. En Render: Web Service -> Settings -> Deploy Hook -> copiar el token/URL
      # 2. En GitHub: Settings -> Secrets and variables -> Actions -> crear secret
      - name: 🚀 Deploy on Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail -X POST "$RENDER_DEPLOY_HOOK_URL" \
          && echo "☑️ Deployment succeeded" \
          || (echo "❌ Deployment failed" && exit 1)